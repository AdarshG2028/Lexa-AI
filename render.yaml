# Render Blueprint for the Lexa backend.
# The frontend deploys separately on Vercel (root directory: frontend).
services:
  - type: web
    name: lexa-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    # The repository also holds the frontend. Only rebuild the API when its own
    # folder changes.
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Secrets and per-environment values are entered in the Render dashboard.
      - key: GROQ_API_KEY
        sync: false
      # Managed Postgres URL, e.g. from Neon. The disk on a free web service is
      # wiped on every restart, so sessions and reports must not live in SQLite.
      - key: DATABASE_URL
        sync: false
      # The Vercel URL of the frontend, e.g. https://lexa-ai.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Optional: lets Vercel preview deployments call the API.
      - key: CORS_ALLOWED_ORIGIN_REGEX
        sync: false

      - key: STT_PROVIDER
        value: groq
      - key: LLM_PROVIDER
        value: groq
      - key: TTS_PROVIDER
        value: groq
      - key: GRAMMAR_PROVIDER
        value: groq
      - key: VOCABULARY_PROVIDER
        value: groq
      # The phoneme model needs ~1.6 GB of RAM, which this instance does not
      # have. "off" makes the endpoint refuse rather than invent findings.
      - key: PRONUNCIATION_PROVIDER
        value: "off"
      # If Groq's voice fails (rate limit, outage) the conversation degrades to
      # a lesser voice instead of stopping. Deepgram is skipped when its key is
      # not set.
      - key: TTS_FALLBACK_PROVIDERS
        value: deepgram,mock
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: SESSION_STORE
        value: database
      # Render's proxy sits in front of the app, so the real client address
      # comes from X-Forwarded-For. Check the "Rate limited" log lines after
      # deploying: if different users all show the same address, adjust this.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
